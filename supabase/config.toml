# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

# A string used to distinguish different Supabase projects on the same host.
# Defaults to the working directory name when running `supabase init`.
project_id = "Bee_Pure"

[api]
enabled = true

# Port to use for the API URL.
port = 54321

# Schemas to expose in your API.
schemas = ["public", "graphql_public"]

# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]

# The maximum number of rows returned by a view, table or stored procedure.
max_rows = 1000

# Controls whether new tables, views, sequences and functions created in the
# public schema by postgres are reachable through the Data API roles.
# auto_expose_new_tables = true

[api.tls]
enabled = false

# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"


[db]
# Port to use for the local database URL.
port = 54322

# Port used by db diff command to initialize the shadow database.
shadow_port = 54320

# Maximum amount of time to wait for health check when starting the database.
health_timeout = "2m"

# Database major version.
major_version = 17


[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100


[db.migrations]
enabled = true
schema_paths = []


[db.seed]
enabled = true
sql_paths = ["./seed.sql"]


[db.network_restrictions]
enabled = false

allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]


# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true


[realtime]
enabled = true

# ip_version = "IPv6"
# max_header_length = 4096


[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# OpenAI API Key to use in Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"


[local_smtp]
enabled = true
port = 54324

# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"


[storage]
enabled = true
file_size_limit = "50MiB"


# Uncomment to configure local storage buckets.
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"


[storage.s3_protocol]
enabled = true


# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true


[storage.analytics]
enabled = false
max_namespaces = 10
max_tables = 10
max_catalogs = 10


[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5


[auth]
enabled = true

# The base URL of your website.
site_url = "http://127.0.0.1:3000"

# Exact URLs permitted for authentication redirects.
additional_redirect_urls = ["https://127.0.0.1:3000"]

# Token lifetime in seconds.
jwt_expiry = 3600

# Refresh token security.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# User registration.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# Password settings.
minimum_password_length = 6
password_requirements = ""


[auth.rate_limit]

email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30


[auth.email]

enable_signup = true
double_confirm_changes = true

# Development setting.
# Production should normally enable email confirmations.
enable_confirmations = false

secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600


[auth.sms]

enable_signup = false
enable_confirmations = false

template = "Your code is {{ .Code }}"

max_frequency = "5s"


[auth.mfa]

max_enrolled_factors = 10


[auth.mfa.totp]

enroll_enabled = false
verify_enabled = false


[auth.mfa.phone]

enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"


[auth.external.apple]

enabled = false
client_id = ""

# DO NOT commit OAuth provider secrets.
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false


[auth.web3.solana]

enabled = false


[auth.third_party.firebase]

enabled = false


[auth.third_party.auth0]

enabled = false


[auth.third_party.aws_cognito]

enabled = false


[auth.third_party.clerk]

enabled = false


[auth.oauth_server]

enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false


# Supabase local Edge Runtime.
#
# Bee Pure is no longer using Supabase Edge Functions for application APIs.
# Our application backend will use Node.js + Express instead.
#
# This section is retained as part of the Supabase CLI configuration.
[edge_runtime]

enabled = true

# Supported request policies:
# "oneshot"
# "per_worker"
policy = "per_worker"

inspector_port = 8083
deno_version = 2


[analytics]

enabled = true
port = 54327
backend = "postgres"


[experimental]

orioledb_version = ""

s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"


[experimental.pgdelta]

enabled = true

# declarative_schema_path = "./schemas"

# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":180,\"commaStyle\":\"trailing\"}"